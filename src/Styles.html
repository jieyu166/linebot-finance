<style>
  :root {
    --accent: #3F7CFF;
    --bg: #F7F8FA;
    --card: #fff;
    --text: #222;
    --muted: #888;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    font-size: 15px;
  }

  #app {
    max-width: 600px;
    margin: 0 auto;
    min-height: 100vh;
    position: relative;
    padding-bottom: 72px;
  }

  a { color: inherit; }

  /* ---- 頂部月份切換 ---- */
  .month-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 14px 12px 8px;
  }
  .month-nav button {
    border: none;
    background: none;
    font-size: 20px;
    color: var(--accent);
    padding: 4px 12px;
    cursor: pointer;
    line-height: 1;
  }
  .month-nav .month-label {
    font-size: 17px;
    font-weight: 600;
  }

  /* ---- 篩選 chip ---- */
  .filter-bar {
    display: flex;
    justify-content: center;
    padding: 0 12px 8px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--card);
    border: 1px solid #E3E6EB;
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 13px;
    color: var(--muted);
  }
  .chip .x { cursor: pointer; color: var(--accent); font-weight: bold; }

  /* ---- 日期分組 ---- */
  .day-group { padding: 0 12px; }
  .day-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 10px 4px 6px;
    font-size: 13px;
    color: var(--muted);
  }
  .day-head .totals span { margin-left: 8px; }
  .day-head .totals .expense { color: #E53935; }
  .day-head .totals .income { color: #43A047; }

  .day-card {
    background: var(--card);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }

  /* ---- 交易列 ---- */
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-bottom: 1px solid #F0F1F4;
    cursor: pointer;
  }
  .row:last-child { border-bottom: none; }
  .row:active { background: #F2F4F8; }

  .row-chip {
    flex: 0 0 36px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    overflow: hidden;
  }

  .row-main { flex: 1; min-width: 0; }
  .row-main .item {
    font-size: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row-main .sub {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .amt {
    flex: 0 0 auto;
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
  }
  .amt.expense { color: #E53935; }
  .amt.income { color: #43A047; }

  /* ---- 空狀態 / 載入 ---- */
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
    font-size: 14px;
  }
  .loading {
    text-align: center;
    color: var(--muted);
    padding: 40px 20px;
    font-size: 14px;
  }

  /* ---- 底部導覽列 ---- */
  .tabbar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 56px;
    background: var(--card);
    border-top: 1px solid #E3E6EB;
    display: flex;
    max-width: 600px;
    margin: 0 auto;
  }
  .tabbar button {
    flex: 1;
    border: none;
    background: none;
    color: var(--muted);
    font-size: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    cursor: pointer;
  }
  .tabbar button.active { color: var(--accent); }
  .tabbar button .ic { font-size: 18px; }

  /* ---- 浮動新增按鈕 ---- */
  .fab {
    position: fixed;
    right: max(16px, calc(50% - 300px + 16px));
    bottom: 72px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    border: none;
    font-size: 28px;
    line-height: 56px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(63,124,255,0.4);
    cursor: pointer;
    z-index: 20;
  }

  /* ---- Toast ---- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 84px;
    transform: translateX(-50%);
    background: rgba(30,30,30,0.9);
    color: #fff;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    max-width: 80%;
    text-align: center;
    z-index: 60;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .toast.show { opacity: 1; }
  .toast.error { background: rgba(229,57,53,0.92); }

  /* ---- 新增／編輯頁覆蓋層 ---- */
  .editor {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: var(--bg);
    overflow-y: auto;
    max-width: 600px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding-bottom: 24px;
  }
  /* 直接子項一律不得因高度不足被壓縮成 0（.editor 本身可捲動即可） */
  .editor > * { flex-shrink: 0; }

  .editor-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 12px;
    background: var(--card);
    border-bottom: 1px solid #E3E6EB;
  }
  .editor-header .editor-close {
    border: none;
    background: none;
    font-size: 18px;
    color: var(--muted);
    cursor: pointer;
    width: 28px;
  }
  .editor-header .editor-title {
    font-size: 16px;
    font-weight: 600;
  }
  .editor-header .editor-header-spacer { width: 28px; }

  .segment {
    display: flex;
    margin: 12px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #E3E6EB;
    background: var(--card);
  }
  .segment button {
    flex: 1;
    border: none;
    background: none;
    padding: 10px 4px;
    font-size: 14px;
    color: var(--muted);
    cursor: pointer;
  }
  .segment button.active {
    background: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  .segment button:disabled { cursor: not-allowed; opacity: 0.55; }

  .amount-display {
    text-align: right;
    padding: 8px 20px 16px;
    font-size: 36px;
    font-weight: 700;
    word-break: break-all;
  }

  .keypad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 56px;
    gap: 1px;
    background: #E3E6EB;
    margin: 0 12px;
    border-radius: 10px;
    overflow: hidden;
    flex: 0 0 auto;
  }
  .keypad .key {
    min-height: 56px;
    border: none;
    background: var(--card);
    font-size: 18px;
    color: var(--text);
    cursor: pointer;
  }
  .keypad .key:active { background: #F2F4F8; }

  .keypad-actions {
    display: flex;
    gap: 8px;
    margin: 8px 12px 16px;
  }
  .keypad-actions button {
    flex: 1;
    min-height: 48px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  .keypad-actions .key-eq {
    background: var(--card);
    color: var(--accent);
    border: 1px solid #E3E6EB;
  }
  .keypad-actions .key-save {
    background: var(--accent);
    color: #fff;
  }

  .catgrid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin: 4px 12px 16px;
  }
  .cat-chip {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 6px 2px;
    border-radius: 10px;
    border: 2px solid transparent;
    cursor: pointer;
    font-size: 11px;
    color: var(--text);
    text-align: center;
  }
  .cat-chip.selected {
    border-color: var(--accent);
    background: var(--card);
  }
  .cat-chip .cat-icon {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
  }
  .cat-chip .cat-name {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }

  .field {
    margin: 0 12px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .field label {
    font-size: 12px;
    color: var(--muted);
  }
  .field input,
  .field select {
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #E3E6EB;
    background: var(--card);
    font-size: 15px;
    color: var(--text);
  }

  .editor-footer {
    display: flex;
    gap: 8px;
    margin: 16px 12px 0;
  }
  .editor-footer button {
    flex: 1;
    min-height: 44px;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
  }
  .editor-footer .btn-delete {
    border: 1px solid #E53935;
    background: var(--card);
    color: #E53935;
  }
  .editor-footer .btn-unlink,
  .editor-footer .btn-link {
    border: 1px solid #E3E6EB;
    background: var(--card);
    color: var(--muted);
  }

  /* ---- 預算分頁 ---- */
  .budget-header {
    display: flex;
    justify-content: center;
    padding: 0 12px 12px;
  }
  .btn-add-budget {
    border: 1px solid var(--accent);
    background: var(--card);
    color: var(--accent);
    border-radius: 999px;
    padding: 8px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .budget-list {
    padding: 0 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .budget-row {
    background: var(--card);
    border-radius: 12px;
    padding: 12px 14px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    cursor: pointer;
  }
  .budget-row-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .budget-icon {
    flex: 0 0 30px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    overflow: hidden;
  }
  .budget-name {
    font-size: 15px;
    font-weight: 600;
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .bar {
    height: 8px;
    border-radius: 4px;
    background: #E3E6EB;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .bar > i {
    display: block;
    height: 100%;
    border-radius: 4px;
  }
  .budget-text {
    font-size: 12px;
    color: var(--muted);
  }

  /* ---- 底部選單（新增預算） ---- */
  .sheet-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 70;
  }
  .sheet {
    background: var(--card);
    width: 100%;
    max-width: 600px;
    border-radius: 16px 16px 0 0;
    padding: 8px 0 24px;
    max-height: 70vh;
    overflow-y: auto;
  }
  .sheet-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px 12px;
    font-size: 16px;
    font-weight: 600;
    border-bottom: 1px solid #F0F1F4;
  }
  .sheet-header .sheet-close {
    border: none;
    background: none;
    font-size: 18px;
    color: var(--muted);
    cursor: pointer;
  }
  .sheet .list {
    display: flex;
    flex-direction: column;
  }
  .sheet .list button {
    border: none;
    background: none;
    text-align: left;
    padding: 14px 16px;
    font-size: 15px;
    color: var(--text);
    border-bottom: 1px solid #F0F1F4;
    cursor: pointer;
  }
  .sheet .list button:last-child { border-bottom: none; }
  .sheet .list button:active { background: #F2F4F8; }

  /* ---- 統計分頁（Task 8） ---- */
  .pie {
    max-width: 260px;
    margin: 12px auto;
  }
  .pie svg {
    display: block;
    width: 100%;
    height: auto;
  }
  .legend {
    padding: 0 12px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .legend-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card);
    border-radius: 12px;
    padding: 10px 14px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    cursor: pointer;
  }
  .dot {
    flex: 0 0 12px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
  }
  .legend-name {
    flex: 1;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .legend-amount {
    font-size: 14px;
    font-weight: 600;
  }
  .legend-pct {
    font-size: 12px;
    color: var(--muted);
    min-width: 34px;
    text-align: right;
  }

  /* ---- 帳戶分頁（Task 9） ---- */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 16px 4px;
  }
  .section-header-title {
    font-size: 18px;
    font-weight: 700;
  }
  .settings-btn {
    border: 1px solid #E3E6EB;
    background: var(--card);
    border-radius: 50%;
    width: 34px;
    height: 34px;
    font-size: 16px;
    color: var(--muted);
    cursor: pointer;
  }
  .section-title {
    padding: 12px 16px 6px;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
  }
  .account-list {
    margin: 0 12px;
    background: var(--card);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  .account-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-bottom: 1px solid #F0F1F4;
    cursor: pointer;
  }
  .account-row:last-child { border-bottom: none; }
  .account-row:active { background: #F2F4F8; }
  .account-name { font-size: 15px; }
  .account-balance { font-size: 15px; font-weight: 600; }
  .accounts-note {
    padding: 14px 16px 20px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }

  /* ---- 帳戶／分類 底部表單 sheet ---- */
  .sheet-form {
    padding: 12px 4px 4px;
  }
  .btn-sheet-save {
    display: block;
    width: calc(100% - 24px);
    margin: 8px 12px 4px;
    min-height: 46px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }

  /* ---- 分類管理覆蓋層 ---- */
  .cats-panel {
    position: fixed;
    inset: 0;
    z-index: 55;
    background: var(--bg);
    overflow-y: auto;
    max-width: 600px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding-bottom: 24px;
  }
  .cats-panel > * { flex-shrink: 0; }
  .cats-list {
    margin: 4px 12px 12px;
    background: var(--card);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  .cats-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-bottom: 1px solid #F0F1F4;
    cursor: pointer;
  }
  .cats-row:last-child { border-bottom: none; }
  .cats-row:active { background: #F2F4F8; }
  .cats-row .cat-icon {
    flex: 0 0 32px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
  }
  .cats-row-name { font-size: 15px; }
  .btn-cat-add {
    display: block;
    width: calc(100% - 24px);
    margin: 4px 12px 16px;
    min-height: 44px;
    border: 1px dashed #C7CCD6;
    border-radius: 10px;
    background: none;
    color: var(--accent);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
</style>
